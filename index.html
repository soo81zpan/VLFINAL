
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pattern Connect</title>

<style>
*{
 box-sizing:border-box;
}

:root{
 --pink:#f15b7e;
 --pink-line:#ff4e79;
 --background:#eae8e9;
 font-family:-apple-system,BlinkMacSystemFont,
 "Apple SD Gothic Neo",Arial,sans-serif;
 color:#242424;
}

html,body{
 margin:0;
 width:100%;
 min-height:100%;
}

body{
 background:#fff;
}

button,select{
 font:inherit;
 cursor:pointer;
}

button:disabled{
 opacity:.38;
 cursor:default;
}

[hidden]{
 display:none!important;
}

/* ===================================
   HOME SCREEN
=================================== */

#home{
 position:relative;
 width:100%;
 height:100dvh;
 min-height:530px;
 background:var(--background);
 overflow:hidden;
 isolation:isolate;
}

.home-scene{
 position:absolute;
 top:0;
 left:0;
 width:100%;
 height:70%;
 overflow:hidden;
 pointer-events:none;
 z-index:1;
}

.motif{
 position:absolute;
 left:var(--x);
 top:var(--y);
 width:var(--w);
 height:auto;
 display:block;

 translate:-50% -50%;

 transform:rotate(var(--angle,0deg));
 transform-origin:50% 50%;

 transition:
  transform .16s cubic-bezier(.18,.85,.3,1);

 pointer-events:none;
 user-select:none;
 -webkit-user-drag:none;
}

/* ===================================
   HOME TITLE IMAGE
=================================== */

.home-menu{
 position:absolute;
 z-index:10;
 left:50%;
 bottom:5.5%;
 transform:translateX(-50%);

 width:min(92%,520px);

 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;

 text-align:center;
 background:transparent;
}

/* 타이틀 PNG — 크기 70%로 축소 */

.home-title-image{
 display:block;

 width:70%;
 max-width:310px;
 height:auto;

 object-fit:contain;

 margin:0 auto 22px;

 user-select:none;
 -webkit-user-drag:none;
}

/* 버튼 그룹 */

.home-actions{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:13px;
}

.home-button{
 min-width:148px;
 height:49px;
 padding:0 21px;

 border-radius:999px;
 border:1.7px solid var(--pink-line);

 font-size:13px;
 font-weight:600;

 transition:
  background .18s,
  transform .18s,
  color .18s;
}

.home-button:hover{
 transform:translateY(-2px);
}

.home-button.outline{
 background:rgba(241,91,126,.035);
 color:var(--pink-line);
}

.home-button.filled{
 background:var(--pink);
 border-color:var(--pink);
 color:#fff;
}

/* ===================================
   GAME SCREEN
=================================== */

#game{
 display:flex;
 flex-direction:column;

 height:100dvh;
 min-height:480px;
 max-width:1300px;

 margin:auto;
 padding:12px 22px 18px;

 background:#fff;
}

.game-header{
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 height:47px;
}

.icon-button{
 width:44px;
 height:44px;

 border:0;
 background:transparent;

 color:#222;
 font-size:24px;
}

.stage-label{
 font-size:11px;
 letter-spacing:2.5px;
 color:#777;
}

.game-heading{
 flex:none;
 text-align:center;
 margin:2px 0 11px;
}

.game-heading h2{
 font-size:25px;
 font-weight:500;
 margin:0 0 6px;
}

.game-heading p{
 font-size:11px;
 color:#999;
 margin:0;
}

.stats{
 flex:none;

 display:flex;
 justify-content:center;

 gap:clamp(15px,4vw,50px);

 text-align:center;
 margin:6px 0 12px;
}

.stat small{
 display:block;
 font-size:10px;
 color:#999;
 margin-bottom:5px;
}

.stat strong{
 font-size:16px;
 font-weight:500;
 font-variant-numeric:tabular-nums;
}

.game-area{
 flex:1;
 min-height:0;

 display:flex;
 align-items:center;
 justify-content:center;

 padding:8px 0;
}

.board{
 position:relative;
 display:grid;

 grid-template-columns:
  repeat(var(--cols),var(--tile-width));

 gap:var(--gap);

 width:max-content;
 max-width:100%;
 margin:auto;
}

.tile{
 position:relative;
 display:block;

 padding:0;
 border:0;
 background:transparent;

 width:var(--tile-width);
 aspect-ratio:var(--ratio);

 transition:transform .15s;
}

.tile img{
 display:block;

 width:100%;
 height:100%;

 object-fit:contain;

 user-select:none;
 pointer-events:none;
}

.tile.selected{
 outline:2px solid var(--pink);
 outline-offset:3px;

 transform:scale(.94);
}

.tile.hint{
 outline:2px solid #edbf4d;
 outline-offset:3px;
}

.tile.empty{
 visibility:hidden;
}

.route{
 position:absolute;
 inset:0;

 width:100%;
 height:100%;

 overflow:visible;
 pointer-events:none;

 z-index:5;
}

.game-footer{
 flex:none;
 text-align:center;
}

#message{
 min-height:20px;

 color:#888;
 font-size:12px;

 margin:7px 0 13px;
}

.tools{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px;
}

.tool{
 border:1px solid #ddd;
 border-radius:24px;

 padding:9px 14px;

 background:#fff;
 color:#222;

 font-size:12px;
}

.tool.primary{
 background:var(--pink);
 border-color:var(--pink);
 color:#fff;
}

/* ===================================
   MODAL
=================================== */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;

 display:flex;
 align-items:center;
 justify-content:center;

 background:rgba(234,232,233,.94);
 backdrop-filter:blur(9px);

 padding:20px;
}

.dialog{
 width:min(100%,440px);

 background:#fff;
 border-radius:18px;

 padding:37px 28px;
 text-align:center;

 box-shadow:0 12px 60px #00000010;
}

.dialog-kicker{
 font-size:10px;
 letter-spacing:3px;
 color:var(--pink);
}

.dialog h2{
 font-size:27px;
 font-weight:500;
 margin:15px 0 20px;
}

.dialog p{
 font-size:13px;
 line-height:1.9;
 color:#666;
 white-space:pre-line;
}

.modal-actions{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-top:25px;
}

/* ===================================
   MOBILE
=================================== */

@media(max-width:700px){

function scheduleMotion(image){

 if(!motionRunning)return;

 const delay=
  900+Math.random()*3000;

 const timer=setTimeout(()=>{

  motionTimers.delete(timer);

  if(!motionRunning)return;

  if(image.style.display==="none"){
   return;
  }

  const angles=[
   90,180,270,360

  const angle=angles[
   Math.floor(Math.random()*angles.length)

  const rotation=
   Number(image.dataset.rotation)+angle;

  image.dataset.rotation=String(rotation);

  image.style.setProperty(
   "--angle",
   rotation+"deg"
  );

  scheduleMotion(image);

 },delay);

 motionTimers.add(timer);
}

/* =====================================
   SOUND
===================================== */

function playSound(type){

 if(!soundEnabled)return;

 try{

  const AC=
   window.AudioContext||
   window.webkitAudioContext;

  if(!AC)return;

  if(!audioContext){
   audioContext=new AC();
  }

  if(audioContext.state==="suspended"){
   audioContext.resume();
  }

  const patterns={
   select:[440],
   match:[660,880],
   wrong:[210],
   hint:[560],
   win:[523,659,784,1047],
   lose:[350,260]
  };

  const frequencies=patterns[type]||[];

  frequencies.forEach((frequency,i)=>{

   const t=
    audioContext.currentTime+
    i*.11;

   const oscillator=
    audioContext.createOscillator();

   const gain=
    audioContext.createGain();

   oscillator.type="sine";
   oscillator.frequency.value=frequency;

   gain.gain.setValueAtTime(
    .0001,t
   );

   gain.gain.exponentialRampToValueAtTime(
    .075,t+.015
   );

   gain.gain.exponentialRampToValueAtTime(
    .0001,t+.1
   );

   oscillator.connect(gain);
   gain.connect(audioContext.destination);

   oscillator.start(t);
   oscillator.stop(t+.11);

  });

 }catch(error){
  console.warn(error);
 }
}

/* =====================================
   PATH FINDING
===================================== */

function findPath(a,b){

 if(
  a===b||
  board[a]===null||
  board[a]!==board[b]
 )return null;

 const H=rows+2;
 const W=cols+2;

 const grid=Array.from(
  {length:H},
  ()=>Array(W).fill(null)
 );

 board.forEach((value,i)=>{

  const [r,c]=coords(i);

  grid[r+1][c+1]=value;

 });

 const [ar,ac]=coords(a);
 const [br,bc]=coords(b);

 const sr=ar+1;
 const sc=ac+1;
 const tr=br+1;
 const tc=bc+1;

 const dr=[-1,0,1,0];
 const dc=[0,1,0,-1];

 const best=Array.from(
  {length:H},
  ()=>Array.from(
   {length:W},
   ()=>[3,3,3,3]
  )
 );

 const queue=[];

 for(let d=0;d<4;d++){

  best[sr][sc][d]=0;

  queue.push({
   r:sr,
   c:sc,
   d,
   turns:0,
   path:[[sr,sc]]
  });
 }

 for(let head=0;head<queue.length;head++){

  const current=queue[head];

  if(
   current.turns!==
   best[current.r][current.c][current.d]
  )continue;

  if(
   current.r===tr&&
   current.c===tc
  ){
   return current.path;
  }

  for(let nd=0;nd<4;nd++){

   const turns=
    current.turns+
    (nd===current.d?0:1);

   const nr=current.r+dr[nd];
   const nc=current.c+dc[nd];

   if(
    turns>2||
    nr<0||nr>=H||
    nc<0||nc>=W
   )continue;

   if(
    grid[nr][nc]!==null&&
    !(nr===tr&&nc===tc)
   )continue;

   if(turns>=best[nr][nc][nd])
    continue;

   best[nr][nc][nd]=turns;

   queue.push({
    r:nr,
    c:nc,
    d:nd,
    turns,
    path:[
     ...current.path,
     [nr,nc]
    ]
   });
  }
 }

 return null;
}

  for(let b=a+1;b<board.length;b++){

   if(
    board[a]===board[b]&&
    findPath(a,b)
   ){
    return[a,b];
   }
  }
 }

 return null;
}

/* =====================================
   BOARD GENERATION
===================================== */

function generateBoard(group,positions=null,ids=null){

 const count=rows*cols;

 const occupied=positions||
  Array.from({length:count},(_,i)=>i);

 const pairIds=ids||
  Array.from(
   {length:occupied.length/2},
   (_,i)=>group[i%group.length]
  );

 for(let attempt=0;attempt<80;attempt++){

  board=Array(count).fill(null);

  const order=shuffleArray([...pairIds]);

  let success=true;

  for(const id of order){

   const empty=shuffleArray(
    occupied.filter(i=>board[i]===null)
   );

   let placed=false;

   for(const a of empty){

    for(const b of empty){

     if(a>=b)continue;

     board[a]=id;
     board[b]=id;

     if(findPath(a,b)){
      placed=true;
      break;
     }

     board[a]=null;
     board[b]=null;
    }

    if(placed)break;
   }

   if(!placed){
    success=false;
    break;
   }
  }

  if(success)return true;
 }

 return false;
}

function buildBoard(){

 const group=groupForStage(stage);

 if(generateBoard(group))return;

 board=Array(rows*cols).fill(null);

 let k=0;

 for(let r=0;r<rows;r++){

  for(let c=0;c<cols;c+=2){

   const id=group[k%group.length];

   board[index(r,c)]=id;
   board[index(r,c+1)]=id;

   k++;
  }
 }
}

/* =====================================
   RESPONSIVE BOARD
===================================== */

function fitBoard(){

 if(
  !rows||
  !cols||
  $("game").hidden
 )return;

 const area=$("gameArea");

 const W=area.clientWidth;
 const H=area.clientHeight;

 const gap=Math.max(
  2,
  Math.min(
   18,
   W/(cols*5),
   H/(rows*5)
  )
 );

 const tileWidth=Math.max(
  1,
  Math.min(
   106,
   (W-gap*(cols-1))/cols,
   (H-gap*(rows-1))*tileRatio/rows
  )
 );

 const root=$("board");

 root.style.setProperty("--cols",cols);
 root.style.setProperty("--gap",gap+"px");
 root.style.setProperty(
  "--tile-width",
  tileWidth+"px"
 );
 root.style.setProperty(
  "--ratio",
  tileRatio
 );
}

window.addEventListener("resize",fitBoard);

/* =====================================
   CONNECTION ANIMATION
===================================== */

function clearRoute(){
 $("route").replaceChildren();
}

function drawRoute(path){

 clearRoute();

 const root=$("board");
 const first=root.querySelector(".tile");

 if(!first)return;

 const style=getComputedStyle(root);

 const gx=parseFloat(style.columnGap)||0;
 const gy=parseFloat(style.rowGap)||0;

 const w=first.getBoundingClientRect().width;
 const h=first.getBoundingClientRect().height;

 const points=path.map(([r,c])=>[
  w/2+(c-1)*(w+gx),
  h/2+(r-1)*(h+gy)
 ]);

 const simplified=points.filter((p,i)=>{

  if(i===0||i===points.length-1)
   return true;

  const a=points[i-1];
  const b=points[i+1];

  return(
   (p[0]-a[0])*(b[1]-p[1])!==
   (p[1]-a[1])*(b[0]-p[0])
  );
 });

 const line=document.createElementNS(
  "http://www.w3.org/2000/svg",
  "polyline"
 );

 line.setAttribute(
  "points",
  simplified.map(p=>p.join(",")).join(" ")
 );

 line.setAttribute("fill","none");
 line.setAttribute("stroke","#f15b7e");
 line.setAttribute("stroke-width","3");
 line.setAttribute(
  "stroke-linecap","round"
 );
 line.setAttribute(
  "stroke-linejoin","round"
 );

 $("route").append(line);

 const len=Math.max(
  1,line.getTotalLength()
 );

 line.animate(
  [
   {
    strokeDasharray:len,
    strokeDashoffset:len
   },
   {
    strokeDasharray:len,
    strokeDashoffset:0
   }
  ],
  {
   duration:280,
   easing:"ease-out",
   fill:"forwards"
  }
 );
}

/* =====================================
   GAME RENDERING
===================================== */

function render(){

 const root=$("board");

 root.querySelectorAll(".tile")
  .forEach(tile=>tile.remove());

 const fragment=document.createDocumentFragment();

 board.forEach((id,i)=>{

  const button=document.createElement("button");

  button.type="button";
  button.className="tile";

  if(id===null){
   button.classList.add("empty");
  }

  if(selected===i){
   button.classList.add("selected");
  }

  if(hints.includes(i)){
   button.classList.add("hint");
  }

  if(id!==null){

   const img=document.createElement("img");

   img.src=imagePath(id);
   img.alt="패턴 "+id;
   img.draggable=false;

   img.onerror=()=>{
    img.style.visibility="hidden";
   };

   button.append(img);
  }

  button.disabled=
   id===null||
   busy||
   paused||
   finished;

  button.addEventListener(
   "click",
   ()=>pickTile(i)
  );

  fragment.append(button);
 });

 root.insertBefore(fragment,$("route"));

 $("stageLabel").textContent=
  "STAGE "+
  String(stage).padStart(2,"0");

 $("groupLabel").textContent=
  stage%2
  ?"Pattern Collection 01–09"
  :"Pattern Collection 10–18";

 $("score").textContent=
  score.toLocaleString("ko-KR");

 $("remaining").textContent=
  board.filter(v=>v!==null).length;

 $("time").textContent=
  formatTime(seconds);

 fitBoard();
}

/* =====================================
   TILE SELECTION
===================================== */

function pickTile(i){

 if(
  paused||
  busy||
  finished||
  board[i]===null
 )return;

 hints=[];

 if(selected===null){

  selected=i;

  playSound("select");
  render();

  return;
 }

 if(selected===i){

  selected=null;
  render();

  return;
 }

 const first=selected;
 const path=findPath(first,i);

 selected=null;

 if(!path){

  playSound("wrong");

  message("연결할 수 없는 패입니다.");

  render();

  return;
 }

 busy=true;
 score+=100;

 playSound("match");

 render();
 drawRoute(path);

 matchTimer=setTimeout(()=>{

  matchTimer=null;

  board[first]=null;
  board[i]=null;

  busy=false;

  clearRoute();

  if(board.every(v=>v===null)){

   finishGame(true);
   return;
  }

  message("연결 성공! +100");

  render();

  if(!findPair()){
   shuffleTiles(true);
  }

 },340);
}

/* =====================================
   SHUFFLE
===================================== */

function shuffleTiles(automatic=false){

 if(paused||busy||finished)return;

 const original=[...board];

 const positions=original.flatMap(
  (v,i)=>v===null?[]:[i]
 );

 const counts=new Map();

 positions.forEach(i=>{

  const id=original[i];

  counts.set(
   id,
   (counts.get(id)||0)+1
  );

 });

 const ids=[];

 for(const [id,count] of counts){

  for(let i=0;i<count/2;i++){
   ids.push(id);
  }
 }

 const group=groupForStage(stage);

 const success=generateBoard(
  group,
  positions,
  ids
 );

 if(!success){

  board=original;

  message("패를 섞지 못했습니다. 다시 시도하세요.");

  render();
  return;
 }

 selected=null;
 hints=[];

 if(!automatic){
  score=Math.max(0,score-50);
 }

 message(
  automatic
  ?"연결 가능한 패가 없어 자동으로 섞었습니다."
  :"패를 섞었습니다. -50"
 );

 render();
}

/* =====================================
   HINT
===================================== */

function showHint(){

 if(paused||busy||finished)return;

 let pair=findPair();

 if(!pair){

  shuffleTiles(true);
  pair=findPair();
 }

 if(!pair){

  message("연결 가능한 패를 찾지 못했습니다.");
  return;
 }

 selected=null;
 hints=pair;

 score=Math.max(0,score-30);

 playSound("hint");

 message("표시된 두 패를 연결하세요. -30");

 render();
}

/* =====================================
   RECORD STORAGE
===================================== */

function recordKey(){

 return "pattern_connect_v5_"+
  $("difficulty").value+
  "_"+
  stage;
}

function readRecord(){

 try{

  return JSON.parse(
   localStorage.getItem(
    recordKey()
   )||"null"
  );

 }catch{
  return null;
 }
}

function updateBest(){

 const record=readRecord();

 $("bestScore").textContent=
  record
  ?record.score.toLocaleString("ko-KR")
  :"—";
}

function saveRecord(){

 try{

  const old=readRecord()||{};

  const elapsed=
   initialTime-seconds;

  localStorage.setItem(
   recordKey(),
   JSON.stringify({
    score:Math.max(
     old.score||0,
     score
    ),
    time:old.time===undefined
     ?elapsed
     :Math.min(old.time,elapsed),
    clears:(old.clears||0)+1
   })
  );

 }catch(error){
  console.warn(error);
 }

 updateBest();
}

/* =====================================
   MODAL
===================================== */

let primaryAction=null;
let secondaryAction=null;

function showModal(
 eyebrow,
 title,
 text,
 primary="OK",
 secondary="Close",
 onPrimary=null,
 onSecondary=null
){

 $("dialogEyebrow").textContent=eyebrow;
 $("dialogTitle").textContent=title;
 $("dialogText").textContent=text;

 $("dialogPrimary").textContent=primary;
 $("dialogSecondary").textContent=secondary;

 primaryAction=onPrimary;
 secondaryAction=onSecondary;

 $("overlay").hidden=false;
}

function closeModal(){
 $("overlay").hidden=true;
}

$("dialogPrimary").onclick=()=>{

 const action=primaryAction;

 closeModal();

 if(action)action();
};

$("dialogSecondary").onclick=()=>{

 const action=secondaryAction;

 closeModal();

 if(action)action();
};

/* =====================================
   HOW TO PLAY
===================================== */

$("howBtn").onclick=()=>{

 showModal(
  "HOW TO PLAY",
  "How to Play",
  "1. Select two identical patterns.\n"+
  "2. Connect them with a path that turns no more than twice.\n"+
  "3. Clear all tiles before time runs out.\n"+
  "4. Odd stages use patterns 01–09, and even stages use 10–18.",
  "Start Game",
  "Close",
  openGame
 );

};

/* =====================================
   GAME FINISH
===================================== */

function finishGame(won){

 finished=true;

 clearInterval(timer);
 timer=null;

 render();

 if(won){

  saveRecord();
  playSound("win");

  showModal(
   "STAGE COMPLETE",
   "Stage "+stage+" Clear!",
   "Score: "+
   score.toLocaleString("ko-KR")+
   "\nTime: "+
   formatTime(initialTime-seconds),
   "Next Stage",
   "Play Again",
   ()=>{
    stage++;
    newGame();
   },
   ()=>newGame()
  );

 }else{

  playSound("lose");

  showModal(
   "TIME OVER",
   "Time Over",
   "Try to clear all the patterns before time runs out.",
   "Restart",
   "Home",
   ()=>newGame(),
   openHome
  );
 }
}

/* =====================================
   PAUSE
===================================== */

function pauseGame(){

 if(finished||busy)return;

 paused=!paused;

 $("pauseBtn").textContent=
  paused?"Resume":"Pause";

 render();

 if(paused){

  showModal(
   "PAUSED",
   "Game Paused",
   "The timer has stopped.",
   "Resume",
   "Home",
   resumeGame,
   openHome
  );
 }
}

function resumeGame(){

 paused=false;

 $("pauseBtn").textContent="Pause";

 render();
}

/* =====================================
   NEW GAME
===================================== */

function newGame(){

 clearInterval(timer);
 clearTimeout(matchTimer);

 timer=null;
 matchTimer=null;

 clearRoute();

 const config=
  LEVELS[$("difficulty").value];

 rows=config.rows;
 cols=config.cols;

 initialTime=Math.max(
  90,
  config.time-(stage-1)*12
 );

 seconds=initialTime;

 score=0;
 selected=null;
 hints=[];

 paused=false;
 finished=false;
 busy=false;

 $("pauseBtn").textContent="Pause";

 buildBoard();

 message("같은 디자인의 패 두 개를 연결하세요.");

 render();
 updateBest();

 timer=setInterval(()=>{

  if(
   paused||
   finished||
   busy||
   $("game").hidden
  )return;

  seconds=Math.max(
   0,seconds-1
  );

  $("time").textContent=
   formatTime(seconds);

  if(seconds===0){
   finishGame(false);
  }

 },1000);
}

/* =====================================
   BUTTON EVENTS
===================================== */

$("startBtn").onclick=openGame;
$("homeBtn").onclick=openHome;

$("hintBtn").onclick=showHint;

$("shuffleBtn").onclick=()=>{
 shuffleTiles(false);
};

$("pauseBtn").onclick=pauseGame;

$("restartBtn").onclick=newGame;

$("soundBtn").onclick=()=>{

 soundEnabled=!soundEnabled;

 $("soundBtn").textContent=
  soundEnabled?"Sound On":"Sound Off";

 if(soundEnabled){
  playSound("select");
 }
};

$("difficulty").onchange=()=>{

 stage=1;
 newGame();
};

$("recordBtn").onclick=()=>{

 if(!finished){

  paused=true;

  $("pauseBtn").textContent="Resume";

  render();
 }

 const record=readRecord();

 showModal(
  "YOUR RECORD",
  "My Records",
  record
  ?"Best Score: "+
   record.score.toLocaleString("ko-KR")+
   "\nBest Time: "+
   formatTime(record.time)+
   "\nClears: "+
   record.clears
  :"No records yet.",
  "Back to Game",
  "Home",
  ()=>{
   if(!finished)resumeGame();
  },
  openHome
 );
};

/* =====================================
   IMAGE RATIO
===================================== */

const sample=new Image();

sample.onload=()=>{

 if(
  sample.naturalWidth&&
  sample.naturalHeight
 ){

  tileRatio=
   sample.naturalWidth/
   sample.naturalHeight;

  fitBoard();
 }
};

sample.src=imagePath(1);

/* =====================================
   INITIALIZE
===================================== */

buildHome();
openHome();

</script>
</body>
</html>
