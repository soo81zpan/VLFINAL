
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사천성 퍼즐</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;background:#14252c;color:#f5faf8;
 font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
main{
 width:min(100%,1000px);
 margin:auto;padding:10px 12px;
}
h1{
 margin:3px 0 9px;text-align:center;
 font-size:clamp(21px,3vw,28px);
}
.topline{
 display:flex;align-items:center;justify-content:center;
 gap:10px;flex-wrap:wrap;margin-bottom:8px;
}
.chip{
 background:#314b52;border-radius:20px;
 padding:6px 12px;font-size:12px;color:#d5ebe5;
}
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:7px;margin-bottom:8px;
}
.stat{
 background:#263d45;border-radius:10px;
 text-align:center;padding:8px 4px;
}
.stat small{
 display:block;color:#a9c6c7;
 font-size:11px;margin-bottom:4px;
}
.stat strong{font-size:17px;font-variant-numeric:tabular-nums}
.controls{
 display:flex;justify-content:center;
 gap:6px;flex-wrap:wrap;margin:8px 0;
}
button,select{
 font:inherit;border:0;border-radius:8px;
 padding:8px 11px;cursor:pointer;
}
.controls button,.controls select{
 background:#d7eae6;color:#18353b;font-size:13px;
}
.controls button:hover{background:#b4dcd5}
button:disabled{cursor:default;opacity:.7}
#nextBtn{background:#eacb7b;color:#263029}
#nextBtn[hidden]{display:none}
#board{
 --cols:8;
 --tile-width:65px;
 --ratio:.825;
 position:relative;
 display:grid;
 grid-template-columns:repeat(var(--cols),var(--tile-width));
 gap:4px;
 padding:8px;
 width:max-content;
 max-width:100%;
 margin:10px auto 0;
 background:#263d45;
 border-radius:12px;
 overflow:visible;
}
.tile{
 width:100%;min-width:0;
 aspect-ratio:var(--ratio);
 display:block;padding:1px;
 background:transparent;
 border:2px solid transparent;
 border-radius:6px;
 overflow:hidden;
 position:relative;
 transition:filter .12s,transform .12s;
}
.tile img{
 width:100%;height:100%;
 object-fit:contain;
 display:block;pointer-events:none;
 user-select:none;
}
.tile.selected{
 border-color:#89efdc;
 box-shadow:0 0 0 2px #54cdb5;
 filter:brightness(1.2);
 transform:scale(.96);
}
.tile.hint{
 border-color:#ffd568;
 box-shadow:0 0 0 2px #ffd568;
}
.tile.empty{visibility:hidden}
#route{
 position:absolute;inset:0;
 width:100%;height:100%;
 overflow:visible;
 pointer-events:none;
 z-index:5;
}
.connection{
 fill:none;stroke:#f7d46e;
 stroke-width:4;stroke-linecap:round;
 stroke-linejoin:round;
 filter:drop-shadow(0 0 4px #fff5b6);
 stroke-dasharray:1000;
 stroke-dashoffset:1000;
 animation:drawline .28s ease-out forwards;
}
@keyframes drawline{
 to{stroke-dashoffset:0}
}
#pauseOverlay{
 position:absolute;inset:0;
 background:rgba(14,29,33,.86);
 display:none;align-items:center;justify-content:center;
 font-size:24px;font-weight:700;
 border-radius:12px;z-index:10;
}
#board.paused #pauseOverlay{display:flex}
#message{
 text-align:center;color:#b9ded6;
 min-height:25px;margin:9px 0;
}
.record{
 background:#263d45;border-radius:10px;
 padding:9px;text-align:center;
 font-size:12px;color:#d6e5e3;
 max-width:530px;margin:8px auto;
}
.record strong{color:#f7d986}
@media(max-width:550px){
 main{padding:7px 4px}
 .stats{gap:4px}
 .stat{padding:6px 2px}
 .stat strong{font-size:14px}
 #board{gap:2px;padding:4px}
 .tile{border-width:1px;border-radius:3px;padding:0}
 .controls button,.controls select{padding:7px;font-size:12px}
 .connection{stroke-width:2.5}
}
</style>
</head>

<body>
<main>
<h1>사천성 퍼즐</h1>

<div class="topline">
 <span class="chip" id="stageLabel">STAGE 1</span>
 <span class="chip" id="groupLabel">디자인 01–09</span>
</div>

<div class="stats">
 <div class="stat">
  <small>점수</small><strong id="score">0</strong>
 </div>
 <div class="stat">
  <small>남은 시간</small><strong id="time">05:00</strong>
 </div>
 <div class="stat">
  <small>남은 패</small><strong id="remaining">0</strong>
 </div>
 <div class="stat">
  <small>스테이지</small><strong id="stageNumber">1</strong>
 </div>
</div>

<div class="controls">
 <select id="difficulty" aria-label="난이도">
  <option value="easy">쉬움</option>
  <option value="normal" selected>보통</option>
  <option value="hard">어려움</option>
 </select>
 <button id="restartBtn">다시 시작</button>
 <button id="hintBtn">힌트</button>
 <button id="shuffleBtn">섞기</button>
 <button id="pauseBtn">일시정지</button>
 <button id="soundBtn">🔊 소리 켜짐</button>
 <button id="nextBtn" hidden>다음 스테이지 →</button>
</div>

<div id="board">
 <svg id="route" aria-hidden="true"></svg>
 <div id="pauseOverlay">일시정지</div>
</div>

<p id="message" role="status">
 같은 디자인의 패를 선택하세요.
</p>

<div class="record">
 <div>현재 스테이지 최고 점수:
  <strong id="bestScore">기록 없음</strong>
 </div>
 <div>최단 완료 시간:
  <strong id="bestTime">기록 없음</strong>
 </div>
 <div>최고 클리어 스테이지:
  <strong id="highestStage">없음</strong>
 </div>
</div>
</main>

<script>
"use strict";

/* ==============================
   1. 이미지 그룹
============================== */

const IMAGE_GROUPS=[
 Array.from({length:9},(_,i)=>i+1),
 Array.from({length:9},(_,i)=>i+10)
];

function imagePath(id){
 return "images/tile"+
   String(id).padStart(2,"0")+".jpg";
}

/* ==============================
   2. 게임 설정
============================== */

const LEVELS={
 easy:{rows:4,cols:6,time:360},
 normal:{rows:5,cols:8,time:300},
 hard:{rows:6,cols:10,time:240}
};

const $=id=>document.getElementById(id);

let stage=1;
let rows=0,cols=0;
let board=[];
let score=0,seconds=0;
let initialTime=0;
let selected=null;
let hints=[];
let timer=null;
let paused=false;
let finished=false;
let busy=false;
let soundOn=true;
let audioContext=null;
let tileRatio=184/223;
let animationTimer=null;

const KEY="shisen_game_v3_";

function groupForStage(n){
 return IMAGE_GROUPS[(n-1)%2];
}

function difficulty(){
 return $("difficulty").value;
}

function recordKey(){
 return KEY+difficulty()+"_stage_"+stage;
}

/* ==============================
   3. 이미지 비율
============================== */

function loadTileRatio(){
 const img=new Image();
 img.onload=()=>{
  if(img.naturalWidth&&img.naturalHeight){
   tileRatio=img.naturalWidth/img.naturalHeight;
   $("board").style.setProperty(
    "--ratio",String(tileRatio)
   );
   fitBoard();
  }
 };
 img.src=imagePath(1);
}

/* ==============================
   4. 화면 높이 자동 맞춤
============================== */

function fitBoard(){
 if(!rows||!cols)return;

 const root=$("board");
 const style=getComputedStyle(root);

 const gap=parseFloat(style.columnGap)||0;
 const rowGap=parseFloat(style.rowGap)||gap;

 const padX=
  (parseFloat(style.paddingLeft)||0)+
  (parseFloat(style.paddingRight)||0);

 const padY=
  (parseFloat(style.paddingTop)||0)+
  (parseFloat(style.paddingBottom)||0);

 const availableWidth=Math.max(
  0,Math.min(root.parentElement.clientWidth,
  window.innerWidth-10)
 );

 const availableHeight=Math.max(
  0,window.innerHeight-
  root.getBoundingClientRect().top-95
 );

 const byWidth=
  (availableWidth-padX-gap*(cols-1))/cols;

 const byHeight=
  (availableHeight-padY-rowGap*(rows-1))
  *tileRatio/rows;

 const size=Math.max(
  1,Math.min(100,byWidth,byHeight)
 );

 root.style.setProperty("--tile-width",size+"px");
}
window.addEventListener("resize",fitBoard);

/* ==============================
   5. 효과음
============================== */

function playSound(type){
 if(!soundOn)return;

 try{
  const AC=window.AudioContext||
   window.webkitAudioContext;
  if(!AC)return;

  if(!audioContext)audioContext=new AC();
  if(audioContext.state==="suspended")
   audioContext.resume();

  const now=audioContext.currentTime;

  const sounds={
   select:[[440,.06]],
   match:[[660,.08],[880,.12]],
   wrong:[[210,.14]],
   hint:[[510,.08]],
   win:[[523,.12],[659,.12],[784,.16],[1047,.25]],
   lose:[[350,.16],[260,.23]]
  };

  let offset=0;
  for(const [frequency,duration] of
      (sounds[type]||[])){

   const osc=audioContext.createOscillator();
   const gain=audioContext.createGain();

   osc.type="sine";
   osc.frequency.value=frequency;

   const t=now+offset;
   gain.gain.setValueAtTime(.0001,t);
   gain.gain.exponentialRampToValueAtTime(.10,t+.012);
   gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

   osc.connect(gain);
   gain.connect(audioContext.destination);

   osc.start(t);
   osc.stop(t+duration+.01);
   offset+=duration;
  }
 }catch(e){
  console.warn("효과음을 재생할 수 없습니다.",e);
 }
}

function toggleSound(){
 soundOn=!soundOn;
 $("soundBtn").textContent=
  soundOn?"🔊 소리 켜짐":"🔇 음소거";
 if(soundOn)playSound("select");
}

/* ==============================
   6. 로컬 기록
============================== */

function readRecord(key){
 try{
  return JSON.parse(localStorage.getItem(key))||{};
 }catch(e){return {}}
}

function writeRecord(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value));
 }catch(e){
  console.warn("기록 저장에 실패했습니다.",e);
 }
}

function updateRecord(){
 const old=readRecord(recordKey());
 const elapsed=initialTime-seconds;

 const best={
  score:Math.max(old.score||0,score),
  time:old.time===undefined
    ?elapsed:Math.min(old.time,elapsed)
 };

 writeRecord(recordKey(),best);

 const highestKey=KEY+difficulty()+"_highest";
 const highest=Number(readRecord(highestKey).value)||0;

 if(stage>highest){
  writeRecord(highestKey,{value:stage});
 }
}

function displayRecords(){
 const record=readRecord(recordKey());

 $("bestScore").textContent=
  record.score===undefined
  ?"기록 없음":record.score.toLocaleString("ko-KR");

 $("bestTime").textContent=
  record.time===undefined
  ?"기록 없음":formatTime(record.time);

 const highest=readRecord(
  KEY+difficulty()+"_highest"
 ).value;

 $("highestStage").textContent=
  highest?highest+" 스테이지":"없음";
}

function formatTime(s){
 return String(Math.floor(s/60)).padStart(2,"0")+
 ":"+String(s%60).padStart(2,"0");
}

/* ==============================
   7. 경로 판정
   최대 2회 방향 전환
============================== */

const index=(r,c)=>r*cols+c;

function coords(i){
 return [Math.floor(i/cols),i%cols];
}

/*
 반환값:
 연결 가능하면 경로 좌표 배열
 연결 불가능하면 null

 좌표는 바깥쪽 빈 테두리까지 포함
*/
function findPath(a,b){
 if(a===b||board[a]===null||
    board[a]!==board[b])return null;

 const H=rows+2,W=cols+2;

 const grid=Array.from({length:H},
  ()=>Array(W).fill(null));

 for(let r=0;r<rows;r++)
  for(let c=0;c<cols;c++)
   grid[r+1][c+1]=board[index(r,c)];

 const [ar,ac]=coords(a);
 const [br,bc]=coords(b);
 const sr=ar+1,sc=ac+1;
 const tr=br+1,tc=bc+1;

 const dr=[-1,0,1,0];
 const dc=[0,1,0,-1];

 const best=Array.from({length:H},()=>
  Array.from({length:W},()=>[3,3,3,3]));

 const queue=[];

 for(let d=0;d<4;d++){
  best[sr][sc][d]=0;
  queue.push({
   r:sr,c:sc,d,turns:0,
   path:[[sr,sc]]
  });
 }

 let head=0;

 while(head<queue.length){
  const cur=queue[head++];

  if(cur.turns!==best[cur.r][cur.c][cur.d])
   continue;

  if(cur.r===tr&&cur.c===tc)
   return cur.path;

  for(let nd=0;nd<4;nd++){
   const turns=cur.turns+(nd===cur.d?0:1);

   if(turns>2)continue;

   const nr=cur.r+dr[nd];
   const nc=cur.c+dc[nd];

   if(nr<0||nr>=H||nc<0||nc>=W)
    continue;

   if(grid[nr][nc]!==null&&
      !(nr===tr&&nc===tc))
    continue;

   if(turns>=best[nr][nc][nd])
    continue;

   best[nr][nc][nd]=turns;

   queue.push({
    r:nr,c:nc,d:nd,turns,
    path:[...cur.path,[nr,nc]]
   });
  }
 }

 return null;
}

function findPair(){
 for(let a=0;a<board.length;a++){
  if(board[a]===null)continue;

  for(let b=a+1;b<board.length;b++){
   if(board[a]===board[b]&&findPath(a,b))
    return[a,b];
  }
 }
 return null;
}

/* ==============================
   8. 연결선 애니메이션
============================== */

function drawConnection(path){
 const svg=$("route");
 svg.replaceChildren();

 if(!path)return;

 const root=$("board");
 const firstTile=root.querySelector(".tile");
 if(!firstTile)return;

 const style=getComputedStyle(root);
 const gap=parseFloat(style.columnGap)||0;
 const rowGap=parseFloat(style.rowGap)||gap;
 const left=parseFloat(style.paddingLeft)||0;
 const top=parseFloat(style.paddingTop)||0;

 const tw=firstTile.getBoundingClientRect().width;
 const th=firstTile.getBoundingClientRect().height;

 const points=path.map(([r,c])=>{
  const x=left+tw/2+(c-1)*(tw+gap);
  const y=top+th/2+(r-1)*(th+rowGap);
  return[x,y];
 });

 // 꺾이는 지점과 시작/끝 지점만 표시
 const reduced=points.filter((p,i)=>{
  if(i===0||i===points.length-1)return true;
  const prev=points[i-1],next=points[i+1];
  return (p[0]-prev[0])*(next[1]-p[1])!==
         (p[1]-prev[1])*(next[0]-p[0]);
 });

 const ns="http://www.w3.org/2000/svg";
 const polyline=document.createElementNS(ns,"polyline");

 polyline.setAttribute("points",
  reduced.map(p=>p.join(",")).join(" "));
 polyline.setAttribute("class","connection");

 svg.appendChild(polyline);

 const length=Math.max(1,polyline.getTotalLength());
 polyline.style.strokeDasharray=length;
 polyline.style.strokeDashoffset=length;
 polyline.style.animation="none";
 polyline.getBoundingClientRect();
 polyline.style.animation="drawline .28s ease-out forwards";

 // 실제 경로 길이에 맞게 애니메이션 끝점 설정
 polyline.animate(
  [{strokeDashoffset:length},{strokeDashoffset:0}],
  {duration:280,fill:"forwards",easing:"ease-out"}
 );
}

function clearConnection(){
 $("route").replaceChildren();
}

/* ==============================
   9. 게임판 그리기
============================== */

function render(){
 const root=$("board");
 root.style.setProperty("--cols",cols);
 root.classList.toggle("paused",paused);

 // 게임 패만 제거하고 SVG 및 오버레이는 유지
 root.querySelectorAll(".tile").forEach(e=>e.remove());

 const frag=document.createDocumentFragment();

 board.forEach((id,i)=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="tile";

  if(id===null)button.classList.add("empty");
  if(selected===i)button.classList.add("selected");
  if(hints.includes(i))button.classList.add("hint");

  if(id!==null){
   const img=document.createElement("img");
   img.src=imagePath(id);
   img.alt="디자인 "+id;
   img.draggable=false;
   button.appendChild(img);
  }

  button.disabled=id===null||paused||finished||busy;
  button.addEventListener("click",()=>pick(i));
  frag.appendChild(button);
 });

 // SVG 앞에 타일 삽입
 root.insertBefore(frag,$("route"));

 $("score").textContent=score.toLocaleString("ko-KR");
 $("remaining").textContent=
  board.filter(v=>v!==null).length;
 $("time").textContent=formatTime(seconds);
 $("stageNumber").textContent=stage;
 $("stageLabel").textContent="STAGE "+stage;

 $("groupLabel").textContent=
  stage%2===1?"디자인 01–09":"디자인 10–18";

 fitBoard();
}

function message(txt){
 $("message").textContent=txt;
}

/* ==============================
   10. 패 선택과 제거
============================== */

function pick(i){
 if(paused||finished||busy||board[i]===null)return;

 hints=[];

 if(selected===null){
  selected=i;
  playSound("select");
  render();
  return;
 }

 if(selected===i){
  selected=null;
  render();
  return;
 }

 const first=selected;
 const path=findPath(first,i);

 if(!path){
  selected=null;
  playSound("wrong");
  message("연결할 수 없는 패입니다.");
  render();
  return;
 }

 busy=true;
 selected=null;
 playSound("match");
 score+=100;

 drawConnection(path);

 if(animationTimer)clearTimeout(animationTimer);

 animationTimer=setTimeout(()=>{
  board[first]=null;
  board[i]=null;

  clearConnection();
  busy=false;
  animationTimer=null;

  if(board.every(v=>v===null)){
   finish(true);
   return;
  }

  message("연결 성공! +100점");
  render();

  if(!findPair()){
   shuffleBoard(true);
  }
 },340);
}

/* ==============================
   11. 패 섞기
============================== */

function shuffleArray(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

function shuffleBoard(auto=false){
 if(paused||finished||busy)return;

 const indices=board.flatMap(
  (v,i)=>v===null?[]:[i]
 );
 const values=indices.map(i=>board[i]);

 if(indices.length<2)return;

 let found=false;

 for(let t=0;t<300;t++){
  shuffleArray(values);
  indices.forEach((i,k)=>board[i]=values[k]);

  if(findPair()){
   found=true;
   break;
  }
 }

 // 무작위 섞기로 쌍을 찾지 못하면
 // 기존 패의 종류와 개수는 유지하면서
 // 연결 가능한 한 쌍을 확보
 if(!found){
  outer:
  for(const a of indices){
   for(const b of indices){
    if(a===b)continue;

    const match=indices.find(
     k=>k!==a&&k!==b&&board[k]===board[a]
    );
    if(match===undefined)continue;

    const original=board[b];
    board[b]=board[a];

    if(findPath(a,b)){
     board[match]=original;
     found=true;
     break outer;
    }

    board[b]=original;
   }
  }
 }

 selected=null;
 hints=[];

 if(!auto)score=Math.max(0,score-50);

 message(
  found
  ?(auto?"연결 가능한 패가 없어 자동으로 섞었습니다."
         :"패를 섞었습니다. -50점")
  :"연결 가능한 쌍을 찾지 못했습니다. 다시 섞어주세요."
 );

 render();
}

/* ==============================
   12. 힌트
============================== */

function showHint(){
 if(paused||finished||busy)return;

 let pair=findPair();

 if(!pair){
  shuffleBoard(true);
  pair=findPair();
 }
 if(!pair)return;

 hints=pair;
 selected=null;
 score=Math.max(0,score-30);
 playSound("hint");

 message("노란색으로 표시된 패를 연결하세요. -30점");
 render();
}

/* ==============================
   13. 타이머 / 종료
============================== */

function finish(win){
 finished=true;
 busy=false;
 clearInterval(timer);
 timer=null;

 if(win){
  playSound("win");
  updateRecord();
  displayRecords();

  $("nextBtn").hidden=false;
  message("🎉 스테이지 "+stage+
   " 클리어! 다음 스테이지로 진행하세요.");
 }else{
  playSound("lose");
  message("⏰ 시간이 종료되었습니다. 다시 도전하세요.");
 }

 render();
}

function togglePause(){
 if(finished||busy)return;
 paused=!paused;

 $("pauseBtn").textContent=
  paused?"계속하기":"일시정지";

 message(paused?"일시정지 중입니다.":"게임을 계속합니다.");
 render();
}

/* ==============================
   14. 스테이지 생성
============================== */

function newGame(){
 clearInterval(timer);
 if(animationTimer)clearTimeout(animationTimer);
 animationTimer=null;
 clearConnection();

 const cfg=LEVELS[difficulty()];

 rows=cfg.rows;
 cols=cfg.cols;

 // 스테이지가 높아지면 제한 시간 감소
 // 최소 90초 보장
 initialTime=Math.max(
  90,cfg.time-(stage-1)*12
 );

 seconds=initialTime;
 score=0;
 selected=null;
 hints=[];
 paused=false;
 finished=false;
 busy=false;

 $("pauseBtn").textContent="일시정지";
 $("nextBtn").hidden=true;

 // 스테이지별로 9종만 사용
 const group=groupForStage(stage);
 const pairCount=rows*cols/2;

 const pairs=[];

 // 9종을 순서대로 반복하여 짝 생성
 for(let i=0;i<pairCount;i++){
  const id=group[i%group.length];
  pairs.push(id,id);
 }

 board=shuffleArray(pairs);

 // 시작 시 적어도 한 쌍이 연결 가능하게 설정
 if(!findPair()){
  for(let t=0;t<300&&!findPair();t++)
   shuffleArray(board);
 }

 if(!findPair()){
  const match=board.findIndex(
   (v,i)=>i>0&&v===board[0]
  );
  if(match>0){
   [board[1],board[match]]=
    [board[match],board[1]];
  }
 }

 message("같은 디자인의 패 두 개를 선택하세요.");
 render();
 displayRecords();

 timer=setInterval(()=>{
  if(paused||finished)return;
  seconds=Math.max(0,seconds-1);
  $("time").textContent=formatTime(seconds);

  if(seconds===0)finish(false);
 },1000);
}

function nextStage(){
 if(!finished)return;
 stage++;
 newGame();
}

/* ==============================
   15. 이벤트 연결
============================== */

$("restartBtn").addEventListener("click",newGame);
$("hintBtn").addEventListener("click",showHint);
$("shuffleBtn").addEventListener("click",
 ()=>shuffleBoard(false));
$("pauseBtn").addEventListener("click",togglePause);
$("soundBtn").addEventListener("click",toggleSound);
$("nextBtn").addEventListener("click",nextStage);

$("difficulty").addEventListener("change",()=>{
 stage=1;
 newGame();
});

/* ==============================
   16. 시작
============================== */

loadTileRatio();
newGame();

</script>
</body>
</html>
