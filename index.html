
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>패턴 연결</title>

<style>
/* ===================================
   CUSTOM FONT
=================================== */

@font-face{
  font-family:"ARCHISCULPTURE";
  src:url("fonts/ARCHISCULPTURE_v375.ttf") format("truetype");
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
}

*{
  box-sizing:border-box;
}

:root{
  --pink:#f15b7e;
  --pink-line:#ff4e79;
  --background:#eae8e9;
  --detail-background:#303030;

  font-family:
    "ARCHISCULPTURE",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

  color:#242424;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#fff;
  font-family:"ARCHISCULPTURE",sans-serif;
}

button,
select,
input,
textarea{
  font-family:"ARCHISCULPTURE",sans-serif;
}

button,select{
  cursor:pointer;
}

button:disabled{
  opacity:.38;
  cursor:default;
}

[hidden]{
  display:none!important;
}

/* ===================================
   HOME
=================================== */

#home{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:530px;
  background:var(--background);
  overflow:hidden;
  isolation:isolate;
}

.home-scene{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:70%;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}

/* ===================================
   HOME GRAPHIC MOTION
=================================== */

.motif-wrap{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--w);

  translate:-50% -50%;
  transform:scale(1);
  transform-origin:center;

  opacity:1;
  pointer-events:auto;

  transition:
    transform .28s cubic-bezier(.2,1.1,.35,1),
    opacity .27s ease;

  z-index:var(--z,1);
  will-change:transform,opacity;
}

.motif{
  display:block;
  width:100%;
  height:auto;

  transform:rotate(var(--angle,0deg));
  transform-origin:50% 50%;

  transition:
    transform .16s cubic-bezier(.18,.85,.3,1);

  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.motif-wrap[data-pattern="1"]{
  cursor:pointer;
}

.motif-wrap[data-pattern="1"]:focus-visible{
  outline:2px solid var(--pink);
  outline-offset:5px;
  border-radius:8px;
}

@media(hover:hover) and (pointer:fine){
  .home-scene.is-hovering
  .motif-wrap:not(.is-active){
    opacity:.25;
  }

  .home-scene .motif-wrap.is-active{
    transform:scale(1.35);
    opacity:1;
    z-index:999!important;
  }
}

/* ===================================
   HOME TITLE
=================================== */

.home-menu{
  position:absolute;
  z-index:1000;
  left:50%;
  bottom:5.5%;
  transform:translateX(-50%);

  width:min(92%,520px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.home-title-image{
  display:block;
  width:70%;
  max-width:310px;
  height:auto;
  object-fit:contain;
  margin:0 auto 22px;
  user-select:none;
  -webkit-user-drag:none;
}

.home-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
}

.home-button{
  min-width:148px;
  height:49px;
  padding:0 21px;

  border-radius:999px;
  border:1.7px solid var(--pink-line);

  font-size:15px;
  font-weight:400;

  transition:
    background .18s,
    transform .18s,
    color .18s;
}

.home-button:hover{
  transform:translateY(-2px);
}

.home-button.outline{
  background:rgba(241,91,126,.035);
  color:var(--pink-line);
}

.home-button.filled{
  background:var(--pink);
  border-color:var(--pink);
  color:#fff;
}

/* ===================================
   DETAIL PAGE
=================================== */

#detail{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  background:var(--detail-background);
  overflow:auto;
  isolation:isolate;
}

.detail-content{
  width:100%;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;
}

.detail-image{
  display:block;
  width:100%;
  height:100dvh;
  object-fit:contain;
  object-position:center;
  user-select:none;
  -webkit-user-drag:none;
}

.detail-back{
  position:fixed;
  top:24px;
  left:28px;
  z-index:2000;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  min-width:112px;
  height:43px;
  padding:0 17px;

  border:1px solid rgba(255,255,255,.5);
  border-radius:999px;

  background:rgba(48,48,48,.8);
  color:#fff;

  font-size:15px;
  font-weight:400;

  backdrop-filter:blur(8px);

  transition:
    background .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.detail-back:hover{
  background:var(--pink);
  border-color:var(--pink);
  transform:translateX(-3px);
}

.detail-back-arrow{
  font-size:19px;
  line-height:1;
}

.detail-error{
  padding:30px;
  text-align:center;
  color:white;
  font-size:16px;
  line-height:1.9;
  white-space:pre-line;
}

/* ===================================
   GAME SCREEN
=================================== */

#game{
  display:flex;
  flex-direction:column;
  height:100dvh;
  min-height:480px;
  max-width:1300px;
  margin:auto;
  padding:12px 22px 18px;
  background:#fff;
}

.game-header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:47px;
}

.icon-button{
  width:44px;
  height:44px;
  border:0;
  background:transparent;
  color:#222;
  font-size:24px;
}

.stage-label{
  font-size:15px;
  letter-spacing:1px;
  color:#777;
}

.game-heading{
  flex:none;
  text-align:center;
  margin:2px 0 11px;
}

.game-heading h2{
  font-size:29px;
  font-weight:400;
  margin:0 0 6px;
}

.game-heading p{
  font-size:14px;
  color:#999;
  margin:0;
}

.stats{
  flex:none;
  display:flex;
  justify-content:center;
  gap:clamp(15px,4vw,50px);
  text-align:center;
  margin:6px 0 12px;
}

.stat small{
  display:block;
  font-size:13px;
  color:#999;
  margin-bottom:5px;
}

.stat strong{
  font-size:19px;
  font-weight:400;
  font-variant-numeric:tabular-nums;
}

.game-area{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 0;
}

.board{
  position:relative;
  display:grid;
  grid-template-columns:
    repeat(var(--cols),var(--tile-width));
  gap:var(--gap);
  width:max-content;
  max-width:100%;
  margin:auto;
}

.tile{
  position:relative;
  display:block;
  padding:0;
  border:0;
  background:transparent;
  width:var(--tile-width);
  aspect-ratio:var(--ratio);
  transition:transform .15s;
}

.tile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}

.tile.selected{
  outline:2px solid var(--pink);
  outline-offset:3px;
  transform:scale(.94);
}

.tile.hint{
  outline:2px solid #edbf4d;
  outline-offset:3px;
}

.tile.empty{
  visibility:hidden;
}

.route{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
  z-index:5;
}

.game-footer{
  flex:none;
  text-align:center;
}

#message{
  min-height:22px;
  color:#888;
  font-size:15px;
  margin:7px 0 13px;
}

.tools{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
}

.tool{
  border:1px solid #ddd;
  border-radius:24px;
  padding:9px 14px;
  background:#fff;
  color:#222;
  font-size:15px;
}

.tool.primary{
  background:var(--pink);
  border-color:var(--pink);
  color:#fff;
}

/* ===================================
   MODAL
=================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:3000;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(234,232,233,.94);
  backdrop-filter:blur(9px);
  padding:20px;
}

.dialog{
  width:min(100%,440px);
  background:#fff;
  border-radius:18px;
  padding:37px 28px;
  text-align:center;
  box-shadow:0 12px 60px #00000010;
}

.dialog-kicker{
  font-size:14px;
  letter-spacing:1px;
  color:var(--pink);
}

.dialog h2{
  font-size:29px;
  font-weight:400;
  margin:15px 0 20px;
}

.dialog p{
  font-size:16px;
  line-height:1.9;
  color:#666;
  white-space:pre-line;
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:25px;
}

/* ===================================
   MOBILE
=================================== */

@media(max-width:700px){
  #home{
    min-height:520px;
  }

  .home-scene{
    height:67%;
  }

  .home-menu{
    bottom:6%;
    width:94%;
  }

  .home-title-image{
    width:70%;
    max-width:230px;
    margin-bottom:18px;
  }

  .home-button{
    min-width:125px;
    height:45px;
    padding:0 15px;
    font-size:14px;
  }

  .detail-back{
    top:16px;
    left:16px;
    min-width:96px;
    height:40px;
    padding:0 13px;
    font-size:14px;
  }

  #game{
    padding:8px 7px 13px;
  }

  .game-heading h2{
    font-size:24px;
  }

  .stats{
    gap:17px;
  }

  .stat strong{
    font-size:16px;
  }

  .tool{
    padding:8px 10px;
    font-size:13px;
  }
}

@media(prefers-reduced-motion:reduce){
  .motif,
  .motif-wrap,
  .tile,
  .home-button,
  .detail-back{
    transition:none;
  }

  .home-scene .motif-wrap.is-active{
    transform:none;
  }
}
</style>
</head>

<body>

<!-- HOME -->

<section id="home">
  <div
    class="home-scene"
    id="homeScene"
    aria-hidden="true">
  </div>

  <div class="home-menu">
    <img
      src="images/Hometitle.png"
      alt="패턴 연결"
      class="home-title-image"
      id="homeTitleImage"
      draggable="false">

    <div class="home-actions">
      <button
        class="home-button outline"
        id="howBtn">
        게임 방법
      </button>

      <button
        class="home-button filled"
        id="startBtn">
        게임 시작
      </button>
    </div>
  </div>
</section>

<!-- DETAIL -->

<section
  id="detail"
  hidden
  aria-label="패턴 상세 설명">

  <button
    class="detail-back"
    id="detailBackBtn"
    aria-label="홈으로 돌아가기">
    <span
      class="detail-back-arrow"
      aria-hidden="true">←</span>
    <span>홈으로</span>
  </button>

  <div
    class="detail-content"
    id="detailContent">

    <img
      src="images/detail1.jpg"
      alt="패턴 1번 상세 설명"
      class="detail-image"
      id="detailImage"
      draggable="false">

  </div>
</section>

<!-- GAME -->

<section id="game" hidden>

  <header class="game-header">
    <button
      class="icon-button"
      id="homeBtn"
      aria-label="홈으로 돌아가기">←</button>

    <span
      class="stage-label"
      id="stageLabel">1단계</span>

    <button
      class="icon-button"
      id="recordBtn"
      aria-label="최고 기록 보기">♡</button>
  </header>

  <div class="game-heading">
    <h2>패턴 연결</h2>
    <p id="groupLabel">패턴 모음 01~09</p>
  </div>

  <div class="stats">
    <div class="stat">
      <small>점수</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>남은 시간</small>
      <strong id="time">05:00</strong>
    </div>
    <div class="stat">
      <small>남은 패</small>
      <strong id="remaining">40</strong>
    </div>
    <div class="stat">
      <small>최고 점수</small>
      <strong id="bestScore">—</strong>
    </div>
  </div>

  <div
    class="game-area"
    id="gameArea">
    <div
      class="board"
      id="board">
      <svg
        id="route"
        class="route"
        aria-hidden="true">
      </svg>
    </div>
  </div>

  <div class="game-footer">
    <p
      id="message"
      role="status">
      같은 디자인의 패 두 개를 연결하세요.
    </p>

    <div class="tools">
      <select
        class="tool"
        id="difficulty"
        aria-label="난이도 선택">
        <option value="easy">쉬움</option>
        <option value="normal" selected>보통</option>
        <option value="hard">어려움</option>
      </select>

      <button class="tool" id="hintBtn">
        힌트
      </button>
      <button class="tool" id="shuffleBtn">
        패 섞기
      </button>
      <button class="tool" id="pauseBtn">
        일시정지
      </button>
      <button class="tool" id="soundBtn">
        소리 켜짐
      </button>
      <button class="tool primary" id="restartBtn">
        다시 시작
      </button>
    </div>
  </div>
</section>

<!-- MODAL -->

<div class="overlay" id="overlay" hidden>
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle">

    <div
      class="dialog-kicker"
      id="dialogEyebrow"></div>

    <h2 id="dialogTitle"></h2>
    <p id="dialogText"></p>

    <div class="modal-actions">
      <button
        class="home-button outline"
        id="dialogSecondary">
        닫기
      </button>
      <button
        class="home-button filled"
        id="dialogPrimary">
        확인
      </button>
    </div>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

/* =====================================
   HOME GRAPHIC LAYOUT
===================================== */

const BASE_WIDTH=848;
const BASE_HEIGHT=490;

const HOME_LAYOUT=[
  [8,35,25],[12,68,57],[3,91,25],
  [9,112,80],[8,145,37],[11,168,57],

  [4,205,28],[5,244,28],[6,267,28],
  [8,305,28],[8,317,28],[8,340,28],
  [9,378,28],[10,415,28],[11,450,28],

  [8,506,32],[12,543,60],[3,583,34],
  [5,626,74],[8,670,27],[11,712,57],
  [9,760,33],[8,811,73],

  [1,34,144],[13,112,143],[8,67,201],
  [6,165,187],[3,204,117],

  [2,233,91],[3,256,91],[7,324,91],
  [3,363,91],[12,385,91],[12,407,91],

  [1,479,80],[2,534,105],[5,630,99],
  [6,650,90],[11,811,78],

  [8,85,110],[12,145,105],[3,180,142],
  [8,560,48],[12,704,124],

  [1,70,166],[13,286,146],[1,336,148],
  [3,538,127],[7,757,144],

  [8,337,186],[8,337,201],[4,592,170],
  [10,628,171],[10,720,170],[15,775,168],

  [14,44,270],[8,98,256],[3,151,282],
  [12,192,239],[6,221,311],[8,254,265],

  [8,337,248],[14,478,248],[6,628,236],
  [15,775,236],

  [13,478,276],[3,535,263],[12,535,279],
  [8,595,294],[8,595,306],

  [8,802,270],[3,726,305],[12,765,330],
  [9,820,358],[8,692,273],

  [8,30,387],[12,78,364],[5,113,416],
  [3,172,396],[8,207,445],[11,250,383],

  [1,479,319],[12,535,318],[12,535,331],
  [8,595,329],[10,445,346],

  [8,337,365],[4,409,370],[9,595,368],
  [7,656,366],

  [3,75,465],[8,154,471],[12,283,430],
  [6,350,452],

  [8,710,415],[14,764,412],[3,810,458],
  [12,729,462],

  [10,595,406],[11,596,438],
  [2,631,438],[2,708,438],[13,746,438]
];

const HOME_WIDTH={
  1:74,2:48,3:32,4:44,5:53,
  6:59,7:71,8:15,9:52,10:58,
  11:29,12:18,13:57,14:44,15:68
};

const MOTIF_SIZE_FACTOR=.58;

const homeNodes=[];
const motionTimers=new Set();
let motionRunning=false;

function homeImagePath(number){
  return "images/Home"+
    String(number).padStart(2,"0")+".png";
}

function clearHomeHover(){
  const root=$("homeScene");

  root.classList.remove("is-hovering");

  root.querySelectorAll(".motif-wrap.is-active")
    .forEach(el=>el.classList.remove("is-active"));
}

/* =====================================
   DETAIL PAGE
===================================== */

const DETAIL_PAGES={
  1:"images/detail1.jpg"
};

function openDetail(number){
  const path=DETAIL_PAGES[number];
  if(!path)return;

  clearHomeHover();
  stopHomeMotion();

  $("overlay").hidden=true;
  $("home").hidden=true;
  $("game").hidden=true;
  $("detail").hidden=false;

  const image=$("detailImage");

  image.style.display="block";
  image.src=path;
  image.alt="패턴 "+number+"번 상세 설명";

  $("detailContent")
    .querySelectorAll(".detail-error")
    .forEach(el=>el.remove());

  $("detail").scrollTop=0;
}

function closeDetail(){
  $("detail").hidden=true;
  $("home").hidden=false;
  $("game").hidden=true;

  clearHomeHover();
  startHomeMotion();
}

$("detailBackBtn").onclick=closeDetail;

$("detailImage").addEventListener("error",()=>{
  const image=$("detailImage");
  image.style.display="none";

  const content=$("detailContent");

  if(content.querySelector(".detail-error"))return;

  const error=document.createElement("p");
  error.className="detail-error";
  error.textContent=
    "상세 이미지를 불러오지 못했습니다.\n"+
    "images/detail1.jpg 파일을 확인해 주세요.";

  content.appendChild(error);
});

/* =====================================
   BUILD HOME GRAPHICS
===================================== */

function buildHome(){
  const root=$("homeScene");
  const fragment=document.createDocumentFragment();

  HOME_LAYOUT.forEach(([number,x,y],i)=>{
    const wrapper=document.createElement("div");

    wrapper.className="motif-wrap";
    wrapper.dataset.pattern=String(number);

    wrapper.style.setProperty(
      "--x",(x/BASE_WIDTH*100)+"%"
    );
    wrapper.style.setProperty(
      "--y",(y/BASE_HEIGHT*100)+"%"
    );

    const relativeWidth=
      HOME_WIDTH[number]*MOTIF_SIZE_FACTOR;

    const widthVW=relativeWidth/BASE_WIDTH*100;
    const maxWidth=relativeWidth*1.75;

    wrapper.style.setProperty(
      "--w",
      `clamp(10px, ${widthVW}vw, ${maxWidth}px)`
    );
    wrapper.style.setProperty("--z",String(i%8));

    const image=document.createElement("img");

    image.className="motif";
    image.alt="";
    image.draggable=false;
    image.decoding="async";
    image.src=homeImagePath(number);
    image.dataset.rotation="0";

    image.onerror=()=>{
      wrapper.style.display="none";
      console.warn("이미지 로딩 실패:",image.src);
    };

    wrapper.addEventListener("pointerenter",event=>{
      if(event.pointerType==="touch")return;

      clearHomeHover();
      wrapper.classList.add("is-active");
      root.classList.add("is-hovering");
    });

    wrapper.addEventListener("pointerleave",()=>{
      wrapper.classList.remove("is-active");

      if(!root.querySelector(".motif-wrap.is-active")){
        root.classList.remove("is-hovering");
      }
    });

    if(DETAIL_PAGES[number]){
      wrapper.setAttribute("role","button");
      wrapper.setAttribute("tabindex","0");
      wrapper.setAttribute(
        "aria-label",
        "패턴 "+number+"번 상세 설명 보기"
      );

      wrapper.addEventListener("click",()=>{
        openDetail(number);
      });

      wrapper.addEventListener("keydown",event=>{
        if(event.key==="Enter"||event.key===" "){
          event.preventDefault();
          openDetail(number);
        }
      });
    }

    wrapper.appendChild(image);
    fragment.appendChild(wrapper);
    homeNodes.push(image);
  });

  root.replaceChildren(fragment);
  root.addEventListener("pointerleave",clearHomeHover);
}

/* =====================================
   RANDOM ROTATION
===================================== */

function stopHomeMotion(){
  motionRunning=false;

  for(const timer of motionTimers){
    clearTimeout(timer);
  }

  motionTimers.clear();
}

function scheduleMotion(image){
  if(!motionRunning)return;

  const delay=900+Math.random()*3000;

  const timer=setTimeout(()=>{
    motionTimers.delete(timer);

    if(!motionRunning)return;

    if(image.parentElement.style.display==="none"){
      return;
    }

    const angles=[90,180,270,360];

    const angle=angles[
      Math.floor(Math.random()*angles.length)
    ];

    const rotation=
      Number(image.dataset.rotation)+angle;

    image.dataset.rotation=String(rotation);
    image.style.setProperty("--angle",rotation+"deg");

    scheduleMotion(image);
  },delay);

  motionTimers.add(timer);
}

function startHomeMotion(){
  stopHomeMotion();

  if(window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches)return;

  motionRunning=true;
  homeNodes.forEach(scheduleMotion);
}

/* =====================================
   GAME SETTINGS
===================================== */

const LEVELS={
  easy:{rows:4,cols:6,time:360},
  normal:{rows:5,cols:8,time:300},
  hard:{rows:6,cols:10,time:240}
};

let stage=1;
let rows=0;
let cols=0;
let board=[];

let score=0;
let seconds=0;
let initialTime=0;

let selected=null;
let hints=[];

let paused=false;
let finished=false;
let busy=false;

let timer=null;
let matchTimer=null;

let soundEnabled=true;
let audioContext=null;

let tileRatio=184/223;

function imagePath(number){
  return "images/tile"+
    String(number).padStart(2,"0")+".jpg";
}

function groupForStage(number){
  return Array.from(
    {length:9},
    (_,i)=>i+(number%2?1:10)
  );
}

function formatTime(value){
  return String(Math.floor(value/60)).padStart(2,"0")+
    ":"+String(value%60).padStart(2,"0");
}

function index(r,c){
  return r*cols+c;
}

function coords(i){
  return[Math.floor(i/cols),i%cols];
}

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function message(text){
  $("message").textContent=text;
}

/* =====================================
   SCREEN TRANSITION
===================================== */

function openHome(){
  clearInterval(timer);
  clearTimeout(matchTimer);

  timer=null;
  matchTimer=null;
  busy=false;
  paused=false;

  $("overlay").hidden=true;
  $("game").hidden=true;

function openGame(){

  $("detail").hidden=true;
  $("game").hidden=false;

  stage=1;
  newGame();

  requestAnimationFrame(fitBoard);
}

/* =====================================
   SOUND
===================================== */

function playSound(type){
  if(!soundEnabled)return;

  try{
    const AC=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AC)return;

    if(!audioContext){
      audioContext=new AC();
    }

    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    const patterns={
      select:[440],
      match:[660,880],
      wrong:[210],
      hint:[560],
      win:[523,659,784,1047],
      lose:[350,260]
    };

    (patterns[type]||[]).forEach((frequency,i)=>{
      const t=audioContext.currentTime+i*.11;
      const oscillator=audioContext.createOscillator();
      const gain=audioContext.createGain();

      oscillator.type="sine";
      oscillator.frequency.value=frequency;

      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(.075,t+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,t+.1);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(t);
      oscillator.stop(t+.11);
    });
  }catch(error){
    console.warn(error);
  }
}

/* =====================================
   PATH FINDING
===================================== */

function findPath(a,b){
  if(a===b||board[a]===null||board[a]!==board[b]){
    return null;
  }

  const H=rows+2;
  const W=cols+2;

  const grid=Array.from(
    {length:H},
    ()=>Array(W).fill(null)
  );

  board.forEach((value,i)=>{
    const [r,c]=coords(i);
    grid[r+1][c+1]=value;
  });

  const [ar,ac]=coords(a);
  const [br,bc]=coords(b);

  const sr=ar+1;
  const sc=ac+1;
  const tr=br+1;
  const tc=bc+1;

  const dr=[-1,0,1,0];
  const dc=[0,1,0,-1];

  const best=Array.from(
    {length:H},
    ()=>Array.from({length:W},()=>[3,3,3,3])
  );

  const queue=[];

  for(let d=0;d<4;d++){
    best[sr][sc][d]=0;

    queue.push({
      r:sr,c:sc,d,turns:0,
      path:[[sr,sc]]
    });
  }

  for(let head=0;head<queue.length;head++){
    const current=queue[head];

    if(current.turns!==
       best[current.r][current.c][current.d]){
      continue;
    }

    if(current.r===tr&&current.c===tc){
      return current.path;
    }

    for(let nd=0;nd<4;nd++){
      const turns=current.turns+
        (nd===current.d?0:1);

      const nr=current.r+dr[nd];
      const nc=current.c+dc[nd];

      if(turns>2||nr<0||nr>=H||nc<0||nc>=W){
        continue;
      }

      if(grid[nr][nc]!==null&&
         !(nr===tr&&nc===tc)){
        continue;
      }

      if(turns>=best[nr][nc][nd]){
        continue;
      }

      best[nr][nc][nd]=turns;

      queue.push({
        r:nr,c:nc,d:nd,turns,
        path:[...current.path,[nr,nc]]
      });
    }
  }

  return null;
}

function findPair(){
  for(let a=0;a<board.length;a++){
    if(board[a]===null)continue;

    for(let b=a+1;b<board.length;b++){
      if(board[a]===board[b]&&findPath(a,b)){
        return[a,b];
      }
    }
  }

  return null;
}

/* =====================================
   BOARD GENERATION
===================================== */

function generateBoard(group,positions=null,ids=null){
  const count=rows*cols;

  const occupied=positions||
    Array.from({length:count},(_,i)=>i);

  const pairIds=ids||
    Array.from(
      {length:occupied.length/2},
      (_,i)=>group[i%group.length]
    );

  for(let attempt=0;attempt<80;attempt++){
    board=Array(count).fill(null);

    const order=shuffleArray([...pairIds]);
    let success=true;

    for(const id of order){
      const empty=shuffleArray(
        occupied.filter(i=>board[i]===null)
      );

      let placed=false;

      for(const a of empty){
        for(const b of empty){
          if(a>=b)continue;

          board[a]=id;
          board[b]=id;

          if(findPath(a,b)){
            placed=true;
            break;
          }

          board[a]=null;
          board[b]=null;
        }

        if(placed)break;
      }

      if(!placed){
        success=false;
        break;
      }
    }

    if(success)return true;
  }

  return false;
}

function buildBoard(){
  const group=groupForStage(stage);

  if(generateBoard(group))return;

  board=Array(rows*cols).fill(null);

  let k=0;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c+=2){
      const id=group[k%group.length];
      board[index(r,c)]=id;
      board[index(r,c+1)]=id;
      k++;
    }
  }
}

/* =====================================
   RESPONSIVE BOARD
===================================== */

function fitBoard(){
  if(!rows||!cols||$("game").hidden)return;

  const area=$("gameArea");
  const W=area.clientWidth;
  const H=area.clientHeight;

  const gap=Math.max(
    2,Math.min(18,W/(cols*5),H/(rows*5))
  );

  const tileWidth=Math.max(
    1,
    Math.min(
      106,
      (W-gap*(cols-1))/cols,
      (H-gap*(rows-1))*tileRatio/rows
    )
  );

  const root=$("board");

  root.style.setProperty("--cols",cols);
  root.style.setProperty("--gap",gap+"px");
  root.style.setProperty("--tile-width",tileWidth+"px");
  root.style.setProperty("--ratio",tileRatio);
}

window.addEventListener("resize",fitBoard);

/* =====================================
   CONNECTION ANIMATION
===================================== */

function clearRoute(){
  $("route").replaceChildren();
}

function drawRoute(path){
  clearRoute();

  const root=$("board");
  const first=root.querySelector(".tile");

  if(!first)return;

  const style=getComputedStyle(root);
  const gx=parseFloat(style.columnGap)||0;
  const gy=parseFloat(style.rowGap)||0;

  const w=first.getBoundingClientRect().width;
  const h=first.getBoundingClientRect().height;

  const points=path.map(([r,c])=>[
    w/2+(c-1)*(w+gx),
    h/2+(r-1)*(h+gy)
  ]);

  const simplified=points.filter((p,i)=>{
    if(i===0||i===points.length-1)return true;

    const a=points[i-1];
    const b=points[i+1];

    return(
      (p[0]-a[0])*(b[1]-p[1])!==
      (p[1]-a[1])*(b[0]-p[0])
    );
  });

  const line=document.createElementNS(
    "http://www.w3.org/2000/svg","polyline"
  );

  line.setAttribute(
    "points",
    simplified.map(p=>p.join(",")).join(" ")
  );

  line.setAttribute("fill","none");
  line.setAttribute("stroke","#f15b7e");
  line.setAttribute("stroke-width","3");
  line.setAttribute("stroke-linecap","round");
  line.setAttribute("stroke-linejoin","round");

  $("route").append(line);

  const len=Math.max(1,line.getTotalLength());

  line.animate(
    [
      {strokeDasharray:len,strokeDashoffset:len},
      {strokeDasharray:len,strokeDashoffset:0}
    ],
    {
      duration:280,
      easing:"ease-out",
      fill:"forwards"
    }
  );
}

/* =====================================
   RENDER GAME
===================================== */

function render(){
  const root=$("board");

  root.querySelectorAll(".tile")
    .forEach(tile=>tile.remove());

  const fragment=document.createDocumentFragment();

  board.forEach((id,i)=>{
    const button=document.createElement("button");

    button.type="button";
    button.className="tile";

    if(id===null)button.classList.add("empty");
    if(selected===i)button.classList.add("selected");
    if(hints.includes(i))button.classList.add("hint");

    if(id!==null){
      const img=document.createElement("img");

      img.src=imagePath(id);
      img.alt="패턴 "+id;
      img.draggable=false;

      img.onerror=()=>{
        img.style.visibility="hidden";
      };

      button.append(img);
    }

    button.disabled=
      id===null||busy||paused||finished;

    button.addEventListener("click",()=>pickTile(i));
    fragment.append(button);
  });

  root.insertBefore(fragment,$("route"));

  $("stageLabel").textContent=stage+"단계";

  $("groupLabel").textContent=
    stage%2
      ?"패턴 모음 01~09"
      :"패턴 모음 10~18";

  $("score").textContent=
    score.toLocaleString("ko-KR");

  $("remaining").textContent=
    board.filter(v=>v!==null).length;

  $("time").textContent=formatTime(seconds);

  fitBoard();
}

/* =====================================
   TILE SELECTION
===================================== */

function pickTile(i){
  if(paused||busy||finished||board[i]===null){
    return;
  }

  hints=[];

  if(selected===null){
    selected=i;
    playSound("select");
    render();
    return;
  }

  if(selected===i){
    selected=null;
    render();
    return;
  }

  const first=selected;
  const path=findPath(first,i);

  selected=null;

  if(!path){
    playSound("wrong");
    message("연결할 수 없는 패입니다.");
    render();
    return;
  }

  busy=true;
  score+=100;

  playSound("match");

  render();
  drawRoute(path);

  matchTimer=setTimeout(()=>{
    matchTimer=null;

    board[first]=null;
    board[i]=null;
    busy=false;

    clearRoute();

    if(board.every(v=>v===null)){
      finishGame(true);
      return;
    }

    message("연결 성공! 100점 획득");
    render();

    if(!findPair()){
      shuffleTiles(true);
    }
  },340);
}

/* =====================================
   SHUFFLE
===================================== */

function shuffleTiles(automatic=false){
  if(paused||busy||finished)return;

  const original=[...board];

  const positions=original.flatMap(
    (v,i)=>v===null?[]:[i]
  );

  const counts=new Map();

  positions.forEach(i=>{
    const id=original[i];
    counts.set(id,(counts.get(id)||0)+1);
  });

  const ids=[];

  for(const [id,count] of counts){
    for(let i=0;i<count/2;i++){
      ids.push(id);
    }
  }

  const success=generateBoard(
    groupForStage(stage),
    positions,
    ids
  );

  if(!success){
    board=original;
    message("패를 섞지 못했습니다. 다시 시도하세요.");
    render();
    return;
  }

  selected=null;
  hints=[];

  if(!automatic){
    score=Math.max(0,score-50);
  }

  message(
    automatic
      ?"연결 가능한 패가 없어 자동으로 섞었습니다."
      :"패를 섞었습니다. 50점 차감"
  );

  render();
}

/* =====================================
   HINT
===================================== */

function showHint(){
  if(paused||busy||finished)return;

  let pair=findPair();

  if(!pair){
    shuffleTiles(true);
    pair=findPair();
  }

  if(!pair){
    message("연결 가능한 패를 찾지 못했습니다.");
    return;
  }

  selected=null;
  hints=pair;
  score=Math.max(0,score-30);

  playSound("hint");
  message("표시된 두 패를 연결하세요. 30점 차감");
  render();
}

/* =====================================
   RECORDS
===================================== */

function recordKey(){
  return "pattern_connect_v5_"+
    $("difficulty").value+"_"+stage;
}

function readRecord(){
  try{
    return JSON.parse(
      localStorage.getItem(recordKey())||"null"
    );
  }catch{
    return null;
  }
}

function updateBest(){
  const record=readRecord();

  $("bestScore").textContent=
    record
      ?record.score.toLocaleString("ko-KR")
      :"—";
}

function saveRecord(){
  try{
    const old=readRecord()||{};
    const elapsed=initialTime-seconds;

    localStorage.setItem(
      recordKey(),
      JSON.stringify({
        score:Math.max(old.score||0,score),
        time:old.time===undefined
          ?elapsed
          :Math.min(old.time,elapsed),
        clears:(old.clears||0)+1
      })
    );
  }catch(error){
    console.warn(error);
  }

  updateBest();
}

/* =====================================
   MODAL
===================================== */

let primaryAction=null;
let secondaryAction=null;

function showModal(
  eyebrow,
  title,
  text,
  primary="확인",
  secondary="닫기",
  onPrimary=null,
  onSecondary=null
){
  $("dialogEyebrow").textContent=eyebrow;
  $("dialogTitle").textContent=title;
  $("dialogText").textContent=text;

  $("dialogPrimary").textContent=primary;
  $("dialogSecondary").textContent=secondary;

  primaryAction=onPrimary;
  secondaryAction=onSecondary;

  $("overlay").hidden=false;
}

function closeModal(){
  $("overlay").hidden=true;
}

$("dialogPrimary").onclick=()=>{
  const action=primaryAction;
  closeModal();
  if(action)action();
};

$("dialogSecondary").onclick=()=>{
  const action=secondaryAction;
  closeModal();
  if(action)action();
};

/* =====================================
   HOW TO PLAY
===================================== */

$("howBtn").onclick=()=>{
  showModal(
    "게임 안내",
    "게임 방법",
    "1. 같은 모양의 패 두 개를 선택하세요.\n"+
    "2. 연결선이 두 번 이하로 꺾이면 패를 제거할 수 있습니다.\n"+
    "3. 제한 시간 안에 모든 패를 제거하면 성공입니다.\n"+
    "4. 홀수 단계에서는 01~09번 패턴을, 짝수 단계에서는 10~18번 패턴을 사용합니다.",
    "게임 시작",
    "닫기",
    openGame
  );
};

/* =====================================
   FINISH GAME
===================================== */

function finishGame(won){
  finished=true;

  clearInterval(timer);
  timer=null;

  render();

  if(won){
    saveRecord();
    playSound("win");

    showModal(
      "단계 완료",
      stage+"단계 성공!",
      "획득 점수: "+
        score.toLocaleString("ko-KR")+
        "점\n소요 시간: "+
        formatTime(initialTime-seconds),
      "다음 단계",
      "다시 도전",
      ()=>{
        stage++;
        newGame();
      },
      ()=>newGame()
    );
  }else{
    playSound("lose");

    showModal(
      "시간 종료",
      "시간이 종료되었습니다",
      "제한 시간 안에 모든 패를 제거해 보세요.",
      "다시 시작",
      "홈으로",
      ()=>newGame(),
      openHome
    );
  }
}

/* =====================================
   PAUSE
===================================== */

function pauseGame(){
  if(finished||busy)return;

  paused=!paused;

  $("pauseBtn").textContent=
    paused?"계속하기":"일시정지";

  render();

  if(paused){
    showModal(
      "일시정지",
      "게임이 일시정지되었습니다",
      "게임 시간이 멈춰 있습니다.",
      "계속하기",
      "홈으로",
      resumeGame,
      openHome
    );
  }
}

function resumeGame(){
  paused=false;
  $("pauseBtn").textContent="일시정지";
  render();
}

/* =====================================
   NEW GAME
===================================== */

function newGame(){
  clearInterval(timer);
  clearTimeout(matchTimer);

  timer=null;
  matchTimer=null;

  clearRoute();

  const config=LEVELS[$("difficulty").value];

  rows=config.rows;
  cols=config.cols;

  initialTime=Math.max(
    90,
    config.time-(stage-1)*12
  );

  seconds=initialTime;
  score=0;
  selected=null;
  hints=[];

  paused=false;
  finished=false;
  busy=false;

  $("pauseBtn").textContent="일시정지";

  buildBoard();
  message("같은 디자인의 패 두 개를 연결하세요.");

  render();
  updateBest();

  timer=setInterval(()=>{
    if(paused||finished||busy||$("game").hidden){
      return;
    }

    seconds=Math.max(0,seconds-1);
    $("time").textContent=formatTime(seconds);

    if(seconds===0){
      finishGame(false);
    }
  },1000);
}

/* =====================================
   BUTTON EVENTS
===================================== */

$("startBtn").onclick=openGame;
$("homeBtn").onclick=openHome;
$("hintBtn").onclick=showHint;
$("shuffleBtn").onclick=()=>shuffleTiles(false);
$("pauseBtn").onclick=pauseGame;
$("restartBtn").onclick=newGame;

$("soundBtn").onclick=()=>{
  soundEnabled=!soundEnabled;

  $("soundBtn").textContent=
    soundEnabled?"소리 켜짐":"소리 꺼짐";

  if(soundEnabled){
    playSound("select");
  }
};

$("difficulty").onchange=()=>{
  stage=1;
  newGame();
};

$("recordBtn").onclick=()=>{
  if(!finished){
    paused=true;
    $("pauseBtn").textContent="계속하기";
    render();
  }

  const record=readRecord();

  showModal(
    "나의 기록",
    "최고 기록",
    record
      ?"최고 점수: "+
        record.score.toLocaleString("ko-KR")+
        "점\n최단 완료 시간: "+
        formatTime(record.time)+
        "\n완료 횟수: "+record.clears+"회"
      :"아직 저장된 기록이 없습니다.",
    "게임으로 돌아가기",
    "홈으로",
    ()=>{
      if(!finished){
        resumeGame();
      }
    },
    openHome
  );
};

/* =====================================
   TILE IMAGE RATIO
===================================== */

const sample=new Image();

sample.onload=()=>{
  if(sample.naturalWidth&&sample.naturalHeight){
    tileRatio=
      sample.naturalWidth/sample.naturalHeight;
    fitBoard();
  }
};

sample.src=imagePath(1);

/* =====================================
   INITIALIZE
===================================== */

buildHome();
openHome();
